version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: hospital-group-history-postgres
    environment:
      POSTGRES_DB: hospital_group_history
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hospital_group_history"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
