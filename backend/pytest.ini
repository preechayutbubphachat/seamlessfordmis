[pytest]
# ---------------------------------------------------------------------------
# SeamlessFordMIS — pytest configuration
# ---------------------------------------------------------------------------
# Run from the backend/ directory:
#   pytest tests/test_desktop_sqlite_workflow.py -v -p no:randomly   (D2.15)
#   pytest tests/ -v --ignore=tests/test_desktop_sqlite_workflow.py  (D2.16)
# ---------------------------------------------------------------------------

# Make "app" importable without installing the package
pythonpath = .

# Default test discovery root
testpaths = tests

# Do NOT add -v/-q here — scripts/run_desktop_sqlite_tests.bat passes -v explicitly
# Do NOT add --tb here — scripts and developers pass their own preference
addopts =

# Treat warnings as non-fatal (some SQLAlchemy 2.x deprecation warnings are expected)
filterwarnings =
    ignore::DeprecationWarning:sqlalchemy
    ignore::DeprecationWarning:pydantic
